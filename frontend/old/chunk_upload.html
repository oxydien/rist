<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload System</title>
  <style>
    .upload-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #f0f0f0;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: #4CAF50;
      width: 0%;
      transition: width 0.3s ease;
    }

    .status {
      margin-top: 10px;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div class="upload-container">
    <input type="file" id="fileInput">
    <button onclick="startUpload()">Upload File</button>
    <div class="progress-bar">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB chunks
    const MAX_CONCURRENT_REQUESTS = 5;
    const RATE_LIMIT_PER_MINUTE = 30;
    const RATE_LIMIT_WINDOW_MS = 60000; // 1 minute in milliseconds
    let uploadId = null;
    let statusCheckInterval = null;

    class RateLimiter {
      constructor(limitPerMinute) {
        this.limitPerMinute = limitPerMinute;
        this.tokens = limitPerMinute;
        this.lastRefill = Date.now();
        this.tokenRefillInterval = RATE_LIMIT_WINDOW_MS / limitPerMinute;
      }

      async waitForToken() {
        while (true) {
          this.refillTokens();
          if (this.tokens > 0) {
            this.tokens--;
            return;
          }
          // Calculate wait time until next token
          const waitTime = Math.max(
            0,
            this.tokenRefillInterval - (Date.now() - this.lastRefill)
          );
          await new Promise(resolve => setTimeout(resolve, waitTime));
        }
      }

      refillTokens() {
        const now = Date.now();
        const timePassed = now - this.lastRefill;
        const newTokens = Math.floor(timePassed / this.tokenRefillInterval);

        if (newTokens > 0) {
          this.tokens = Math.min(
            this.limitPerMinute,
            this.tokens + newTokens
          );
          this.lastRefill = now;
        }
      }
    }

    class ChunkUploadQueue {
      constructor(file, totalChunks, concurrency = MAX_CONCURRENT_REQUESTS) {
        this.file = file;
        this.totalChunks = totalChunks;
        this.concurrency = concurrency;
        this.queue = Array.from({ length: totalChunks }, (_, i) => i);
        this.active = new Set();
        this.completed = new Set();
        this.failed = new Map();
        this.maxRetries = 3;
        this.standardRateLimiter = new RateLimiter(RATE_LIMIT_PER_MINUTE);
        this.lastStatusUpdate = Date.now();
      }

      async processQueue() {
        while (this.queue.length > 0 || this.active.size > 0) {
          // Update status periodically
          const now = Date.now();
          if (now - this.lastStatusUpdate > 1000) {
            this.updateStatus();
            this.lastStatusUpdate = now;
          }

          // Fill up active slots
          while (this.queue.length > 0 && this.active.size < this.concurrency) {
            const chunkIndex = this.queue.shift();
            this.active.add(chunkIndex);
            this.uploadChunk(chunkIndex).catch(console.error);
          }

          // Wait a bit before checking again
          await new Promise(resolve => setTimeout(resolve, 100));
        }

        // Final status update
        this.updateStatus();

        // Check if all chunks completed successfully
        if (this.completed.size === this.totalChunks) {
          return true;
        } else {
          throw new Error(`Upload failed. Failed chunks: ${Array.from(this.failed.keys()).join(', ')}`);
        }
      }

      async uploadChunk(chunkIndex) {
        const retryCount = this.failed.get(chunkIndex) || 0;

        try {
          // Wait for rate limiter token
          await this.standardRateLimiter.waitForToken();

          const start = chunkIndex * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, this.file.size);
          const chunk = this.file.slice(start, end);

          const response = await fetch(`/api/upload/part/${uploadId}/${chunkIndex}`, {
            method: 'POST',
            body: chunk,
          });

          if (!response.ok) {
            if (response.status === 429) { // Too Many Requests
              // Put the chunk back in the queue and wait longer
              this.queue.push(chunkIndex);
              await new Promise(resolve => setTimeout(resolve, 2000));
              return;
            }
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          await response.json();
          this.completed.add(chunkIndex);
        } catch (error) {
          console.error(`Chunk ${chunkIndex} failed:`, error);

          if (retryCount < this.maxRetries) {
            this.failed.set(chunkIndex, retryCount + 1);
            this.queue.push(chunkIndex);
            // Add exponential backoff for retries
            await new Promise(resolve => setTimeout(resolve, Math.pow(2, retryCount) * 1000));
          } else {
            throw new Error(`Chunk ${chunkIndex} failed after ${this.maxRetries} retries`);
          }
        } finally {
          this.active.delete(chunkIndex);
        }
      }

      updateStatus() {
        const statusDiv = document.getElementById('status');
        const progress = {
          completed: this.completed.size,
          total: this.totalChunks,
          active: Array.from(this.active),
          queued: this.queue.length,
          failed: Array.from(this.failed.entries()),
          progress: ((this.completed.size / this.totalChunks) * 100).toFixed(2) + '%'
        };
        statusDiv.textContent = JSON.stringify(progress, null, 2);

        // Update progress bar
        const progressBar = document.getElementById('progressBar');
        progressBar.style.width = progress.progress;
      }
    }

    async function calculateSHA256(file) {
      const buffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function requestUpload(file) {
      const hash = await calculateSHA256(file);
      const response = await fetch('/api/upload/request', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          upload_method: 2, // Chunked upload
          file_size: file.size,
          file_name: file.name,
          file_hash: hash,
          expires_at: 0, // Never expires
        }),
      });
      if (!response.ok) {
        throw new Error(`Upload request failed: ${response.status}`);
      }
      return await response.json();
    }

    async function checkUploadStatus() {
      try {
        const response = await fetch(`/api/upload_status/${uploadId}`);
        if (!response.ok) {
          throw new Error(`Status check failed: ${response.status}`);
        }
        const status = await response.json();

        if (status.state === 'Completed' || status.state === 'Failed') {
          clearInterval(statusCheckInterval);
        }
        return status;
      } catch (error) {
        console.error('Status check error:', error);
        document.getElementById('status').textContent += '\nStatus check error: ' + error.message;
      }
    }

    async function startUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const statusDiv = document.getElementById('status');

      if (!file) {
        alert('Please select a file first!');
        return;
      }

      try {
        statusDiv.textContent = 'Requesting upload...';
        const uploadRequest = await requestUpload(file);
        if (!uploadRequest.approved) {
          throw new Error('Upload not approved');
        }

        uploadId = uploadRequest.upload_id;
        const totalChunks = uploadRequest.upload_parts;

        statusDiv.textContent = `Upload approved. Total chunks: ${totalChunks}`;

        // Start status checking
        statusCheckInterval = setInterval(async () => {
          const status = await checkUploadStatus();
          if (status) {
            console.log('Server status:', status);
          }
        }, 2000);

        // Create and start the upload queue
        const uploadQueue = new ChunkUploadQueue(file, totalChunks);
        await uploadQueue.processQueue();

        statusDiv.textContent += '\nUpload completed successfully!';

      } catch (error) {
        console.error('Upload failed:', error);
        clearInterval(statusCheckInterval);
        statusDiv.textContent += '\nError: ' + error.message;
      }
    }
  </script>
</body>

</html>
